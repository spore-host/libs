# spore.host application catalog
#
# Container-based catalog (#290): each app ships as a Docker image pulled at
# launch onto a GPU base AMI, instead of a baked per-app AMI. Adding/updating an
# app is a `docker push`, not a 9-region Packer matrix.
#
# Base AMI (spore-host#286/#389): the launcher resolves the AWS-maintained Deep
# Learning Base GPU AMI (Amazon Linux 2023) — NVIDIA driver preinstalled, present
# in every region — via an SSM public parameter at launch, and installs the
# (free, self-licensing) Amazon DCV server at boot. So there is NO owned/shared
# base AMI: the per-app-per-region AMI table that drifted into dangling,
# duplicated, and unshared IDs (#389) is gone by construction. An app may still
# set an optional `base_amis:` pin to a custom pre-baked image, but should not.
#
# Images live under public.ecr.aws/f8g1e7l5 — the build account's default ECR
# Public alias. (A custom "spore-host" alias needs an async AWS approval; switch
# the image: prefixes if/when it's granted.)
#
# Launch kind (#590/#591): each app has a `kind` — "application" (a single GUI
# app streamed over a DCV virtual session; the default, and what `dcv: true`
# means), "desktop" (a bare Linux desktop over DCV, no specific app), or "web"
# (an app that serves its own web UI on `port`, fronted by a TLS reverse proxy —
# no DCV). Web apps set `port` (+ optional `health_path`, default "/").

apps:
  - name: code-server
    description: "VS Code in the browser (code-server)"
    kind: web
    port: 8080
    instance_families: [c7i, m7i]
    min_vcpus: 2
    min_memory_gib: 4
    gpu: false
    idle_timeout_default: 30m
    aliases: [vscode]
    license: open-source
    # Public upstream image. Runs auth-less on 0.0.0.0 inside the container —
    # access is gated by spored's :443 proxy token (spawn#590), not by the app.
    image: codercom/code-server
    tag_default: latest
    visibility: public
    args: [--bind-addr, "0.0.0.0:8080", --auth, none]

  - name: openrefine
    description: "Data cleaning & transformation (OpenRefine)"
    kind: web
    port: 3333
    instance_families: [c7i, m7i]
    min_vcpus: 2
    min_memory_gib: 8
    gpu: false
    idle_timeout_default: 30m
    aliases: [refine]
    license: open-source
    # OpenRefine ships no official image — we build one from the upstream release
    # (spore-host/app-images), which binds 0.0.0.0:3333 auth-less (access gated by
    # spored's :443 proxy token). No args needed. See the app-images repo for the
    # "bring your own app to spawn" tutorial.
    image: ghcr.io/spore-host/openrefine
    tag_default: "3.10.1"
    visibility: public

  - name: jupyter
    description: "JupyterLab notebooks in the browser"
    kind: web
    port: 8888
    instance_families: [c7i, m7i]
    min_vcpus: 2
    min_memory_gib: 8
    gpu: false
    idle_timeout_default: 30m
    aliases: [jupyterlab, notebook]
    license: open-source
    # Public upstream image. Runs token-less on 0.0.0.0 (access gated by spored's
    # :443 proxy token, spawn#590); allow_origin/trust_xheaders let it work behind
    # the reverse proxy. Args validated against the image locally.
    image: quay.io/jupyter/base-notebook
    tag_default: latest
    visibility: public
    args: [start-notebook.py, "--IdentityProvider.token=", "--ServerApp.ip=0.0.0.0", "--ServerApp.allow_origin=*", "--ServerApp.trust_xheaders=True"]

  - name: desktop
    description: "A bare Linux desktop — open a terminal and run anything (DCV)"
    kind: desktop
    instance_families: [c7i, m7i, c6i]
    min_vcpus: 2
    min_memory_gib: 8
    gpu: false
    dcv: true
    idle_timeout_default: 30m
    aliases: [workspace]
    license: open-source
    # No image/recipe: a desktop session installs a desktop environment at boot
    # and runs it as the DCV session (no application container). Pass a GPU
    # instance type (--instance-type g6.xlarge) for a GL-accelerated desktop.


  - name: paraview
    description: "Scientific visualization — CFD, FEA, large mesh"
    instance_families: [g6, g5, g4dn]
    high_vram_families: [g6e]
    min_vcpus: 4
    min_memory_gib: 16
    gpu: true
    min_vram_gib: 24
    dcv: true
    idle_timeout_default: 20m
    aliases: [pv]
    license: open-source
    # Recipe, not cake (#392): spore.host ships the public build recipe; the
    # actual image is BYO. Build with infra/amis/containers/build-push.sh and bind
    # it in ~/.spawn/catalog.yaml (image:/tag_default:), or launch with --image.
    # No base_amis: the GPU DLAMI base is resolved via SSM at launch (#286/#389).
    recipe: infra/amis/containers/paraview

  - name: chimerax
    description: "Protein structure visualization, cryo-EM (UCSF ChimeraX)"
    instance_families: [g6, g5]
    high_vram_families: [g6e]
    min_vcpus: 4
    min_memory_gib: 16
    gpu: true
    min_vram_gib: 24
    dcv: true
    idle_timeout_default: 20m
    aliases: [chimera]
    license: open-source
    # Recipe, not cake (#392). ChimeraX also has a license-gated download — the
    # recipe (infra/amis/containers/chimerax) documents the human .deb step.
    # No base_amis: the GPU DLAMI base is resolved via SSM at launch (#286/#389).
    recipe: infra/amis/containers/chimerax

  - name: igv
    description: "Integrative Genomics Viewer — genome browser, sequencing data"
    instance_families: [c7i, m7i, c6i]
    min_vcpus: 4
    min_memory_gib: 16
    gpu: false
    dcv: true
    idle_timeout_default: 30m
    launch_command: /opt/igv/igv.sh
    license: open-source
    # CPU app — container image + CPU base AMI pending (#290).

  - name: qgis
    description: "GIS analysis, remote sensing, ecology"
    instance_families: [c7i, m7i]
    min_vcpus: 4
    min_memory_gib: 8
    gpu: false
    dcv: true
    idle_timeout_default: 30m
    launch_command: /usr/bin/qgis
    license: open-source

  - name: fiji
    description: "Image analysis — microscopy, histology, connectomics (ImageJ/Fiji)"
    instance_families: [c7i, m7i]
    min_vcpus: 4
    min_memory_gib: 16
    gpu: false
    dcv: true
    idle_timeout_default: 30m
    launch_command: /opt/fiji/ImageJ-linux64
    aliases: [imagej]
    license: open-source

  - name: ds9
    description: "Astronomical image display — observatory standard (SAO)"
    instance_families: [c7i, m7i]
    min_vcpus: 2
    min_memory_gib: 4
    gpu: false
    dcv: true
    idle_timeout_default: 30m
    launch_command: /usr/bin/ds9
    license: open-source
