name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover.
# Belt-and-suspenders to the orion runner's /home/runner/.env (spore-host#345);
# this also covers GitHub-hosted fallback runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # Formatting gate (libs#30). Runs first because it's the cheapest check and
      # the fastest to act on. Nothing checked formatting before — this repo has
      # no Makefile, so there wasn't even a local `fmt` target anyone might run,
      # and three files sat unformatted on main.
      #
      # The key property is that it REPORTS rather than fixes: `gofmt -w`
      # rewrites files and exits 0, so a gate built on it could only ever report
      # success. gofmt walks paths rather than modules, so this covers everything.
      - name: Format gate
        run: |
          files=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            echo "::error::these files are not gofmt-clean — run 'gofmt -w' on them:"
            echo "$files" | sed 's/^/  /'
            gofmt -d $files
            exit 1
          fi
          echo "✓ gofmt clean"

      - name: Test
        # -tags online runs the catalog resolvability gate (libs#18) as part of
        # the suite, so its registry-probe code is exercised + counted toward
        # coverage. A dead/private/wrong image ref in the shipped catalog fails
        # here. (The `online` tag is omitted from local `go test` so dev runs stay
        # offline; CI always has network.)
        run: go test -tags online -coverprofile=coverage.out ./...

      - name: Coverage gate
        env:
          # Ratchet floor — must not drop below this. Raise it as coverage
          # improves; target is 60% (see CLAUDE.md). Current: ~78.0%.
          MIN_COVERAGE: '75'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Vet
        run: go vet ./...
