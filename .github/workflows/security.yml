name: Security

# libs had no security workflow at all until #35, while every sibling repo
# (spawn, truffle, lagotto, spore-host-mcp, the umbrella) had one. That gap was
# not cosmetic: libs is imported by all four CLIs, so a vulnerable dependency here
# propagates to every one of them — and one already had. libs sat on
# golang.org/x/text v0.21.0 (CVE-2026-56852, HIGH) while all three CLIs had been
# forced to v0.39.0 by *their* scans. Nothing looked at this layer.
#
# It also means no Semgrep, and Semgrep is what flags mutable action tags — which
# is why libs was the only repo still using floating tags (`@v6`) until #32, with
# nothing to catch it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly Monday 08:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    # GitHub-hosted, unlike ci.yml's self-hosted orion runner: the scanners want a
    # clean filesystem, and orion's persists between jobs (the reason ci.yml sets
    # `cache: false`). Nothing here needs orion's arm64 or its warm module cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - name: Install govulncheck
        # Pinned: govulncheck v1.4.0 panics ("ForEachElement called on type
        # containing *types.TypeParam") when analyzing code that uses generics,
        # so @latest crashes the scan with exit 1 (not a vulnerability finding).
        # v1.3.0 is the last release that handles generic code. Bump once the
        # upstream regression is fixed.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan
        # Single module here, but scan by discovery rather than hardcoding "." so
        # this keeps working if libs ever gains a nested go.mod.
        run: |
          set -e
          fail=0
          for mod in $(find . -name go.mod -not -path '*/vendor/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            ( cd "$dir" && govulncheck ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history so leaked-then-removed secrets are caught
      # Run the gitleaks BINARY directly (MIT-licensed, free for orgs). The
      # gitleaks-action wrapper requires a paid license for GitHub organizations,
      # which we don't use. `detect` scans full history; non-zero exit on leaks.
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Trivy filesystem scan (vulns + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Trivy config scan (IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Enforcing: fails the build on findings. Triaged false-positives are
      # annotated inline with `# nosemgrep: <rule-id> -- <reason>`.
      - name: Semgrep scan
        run: semgrep scan --config=auto --error .
